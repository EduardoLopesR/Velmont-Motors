<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Velmont Motors</title>
    <link rel="stylesheet" href="/styles/login.css">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>

    </style>
</head>

<body>
    <header>
        <h1>Velmont Motors</h1>

        <input type="text" id="usuario" placeholder="Username">

        <input type="password" id="senha" placeholder="Password">

        <button onclick="login()">Login</button>

        <div id="mensagem"></div>
        <h2 onclick="window.location.href='/src/pages/home.html'">aaaaaaa</h2>
    </header>

</body>
    <script>
        async function login() {
        const usuario = document.getElementById("usuario").value;
        const senha = document.getElementById("senha").value;

        const resposta = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ usuario, senha })
        });

        const dados = await resposta.json();
        const mensagem = document.getElementById("mensagem");

        if (dados.sucesso) {
            mensagem.style.color = "green";
            mensagem.innerHTML = "Login realizado com sucesso!";
            setTimeout(() => {
                window.location = "painel.html";
            }, 1000);
        } else {
            mensagem.style.color = "red";
            mensagem.innerHTML = "Usuário ou senha incorretos.";
        }
    }
    </script>
</html>
